name: Fly Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'talentflow-api/**'
      - '.github/workflows/fly-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flyctl
        # Pin a commit SHA para supply-chain hardening — @master é moving target.
        # Atualizado em 2026-08-15 (HEAD de superfly/flyctl-actions no momento).
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        
      - name: Deploy to Fly.io
        run: flyctl deploy
        working-directory: talentflow-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
