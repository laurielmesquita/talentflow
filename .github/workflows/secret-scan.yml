name: Secret Scan

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for leaked secrets
        shell: bash
        run: |
          set -euo pipefail
          PATTERNS=(
            'npg_[A-Za-z0-9]{20,}'
            'sk_live_[A-Za-z0-9]{16,}'
            'sk_test_[A-Za-z0-9]{20,}'
            'ghp_[A-Za-z0-9]{36,}'
            'github_pat_[A-Za-z0-9_]{30,}'
            'gho_[A-Za-z0-9]{36,}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'AKIA[A-Z0-9]{14,}'
            'AIzaSy[A-Za-z0-9_\-]{33}'
            'whsec_[A-Za-z0-9]{20,}'
            'Bearer eyJ[A-Za-z0-9_\-]+\.eyJ[A-Za-z0-9_\-]+\.'
            'postgresql://[^:/@\s]+:[^/@\s]+@[a-z0-9.-]+\.neon\.tech'
            'mongodb(\+srv)?://[^:/@\s]+:[^/@\s]+@'
            '^-----BEGIN [A-Z ]*PRIVATE KEY-----'
          )
          EXCLUDE=(--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.next --exclude-dir=__pycache__ --exclude-dir=.backups --exclude='*.lock' --exclude='*.sum')
          FOUND=false
          for pat in "${PATTERNS[@]}"; do
            if grep -REi "$pat" . "${EXCLUDE[@]}" 2>/dev/null | grep -q .; then
              echo "❌ Padrão de credencial detectado: $pat"
              grep -REi "$pat" . "${EXCLUDE[@]}" 2>/dev/null | head -5
              FOUND=true
            fi
          done
          if $FOUND; then
            echo "::error::Secrets detectados no repositório. Bloqueando CI."
            exit 1
          fi
          echo "✅ Nenhum segredo detectado."