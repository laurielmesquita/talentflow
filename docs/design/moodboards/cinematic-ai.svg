<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TalentFlow Cinematic AI moodboard</title>
  <desc id="desc">Composição cinematográfica com esfera de dados, cartões flutuantes e contraste entre azul profundo e coral.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".6" stop-color="#102d46"/><stop offset="1" stop-color="#170c25"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#fff7ed"/><stop offset=".3" stop-color="#fb7185"/><stop offset=".72" stop-color="#2563eb" stop-opacity=".8"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1070" cy="470" r="410" fill="url(#orb)" filter="url(#blur)"/>
  <circle cx="1040" cy="460" r="245" fill="url(#orb)" opacity=".85"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".28">
    <ellipse cx="1040" cy="460" rx="330" ry="110" transform="rotate(-24 1040 460)" stroke-width="2"/>
    <ellipse cx="1040" cy="460" rx="370" ry="145" transform="rotate(38 1040 460)" stroke-width="2"/>
    <ellipse cx="1040" cy="460" rx="260" ry="310" transform="rotate(70 1040 460)" stroke-width="2"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="120" fill="#67e8f9" font-size="22" letter-spacing="5">TALENTFLOW / MOODBOARD 02</text>
    <text x="90" y="240" fill="#fff" font-size="78" font-weight="700">Menos triagem.<br/><tspan fill="#fb7185">Mais decisão.</tspan></text>
    <text x="94" y="355" fill="#cbd5e1" font-size="24">Uma narrativa visual para mostrar a IA em ação.</text>
    <rect x="90" y="470" width="430" height="230" rx="24" fill="#0f2035" fill-opacity=".88" stroke="#67e8f9" stroke-opacity=".3" filter="url(#shadow)" transform="rotate(-5 305 585)"/>
    <text x="130" y="545" fill="#94a3b8" font-size="16" letter-spacing="2">PIPELINE AO VIVO</text>
    <text x="130" y="600" fill="#fff" font-size="31" font-weight="600">Currículo processado</text>
    <circle cx="150" cy="650" r="8" fill="#34d399"/><text x="175" y="657" fill="#cbd5e1" font-size="18">Dados estruturados com sucesso</text>
    <rect x="1180" y="200" width="300" height="170" rx="22" fill="#101e35" fill-opacity=".9" stroke="#fb7185" stroke-opacity=".45" filter="url(#shadow)" transform="rotate(8 1330 285)"/>
    <text x="1220" y="255" fill="#fda4af" font-size="15" letter-spacing="2">AI SIGNAL</text><text x="1220" y="305" fill="#fff" font-size="30" font-weight="600">94% match</text>
    <rect x="1190" y="720" width="330" height="190" rx="22" fill="#101e35" fill-opacity=".9" stroke="#fbbf24" stroke-opacity=".4" filter="url(#shadow)" transform="rotate(-7 1355 815)"/>
    <text x="1230" y="780" fill="#fcd34d" font-size="15" letter-spacing="2">NEXT ACTION</text><text x="1230" y="830" fill="#fff" font-size="27" font-weight="600">Agendar entrevista</text>
    <text x="90" y="900" fill="#94a3b8" font-size="18">DIREÇÃO: cinema · fluxo · luz volumétrica · IA tangível</text>
  </g>
</svg>
