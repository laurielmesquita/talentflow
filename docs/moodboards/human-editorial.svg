<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TalentFlow Human Editorial moodboard</title>
  <desc id="desc">Composição editorial clara com fotografia abstrata de pessoas, tipografia quente e cartões de produto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf7"/><stop offset="1" stop-color="#ebe7ff"/></linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#312e81" flood-opacity=".16"/></filter>
    <clipPath id="photo"><rect x="970" y="120" width="470" height="650" rx="34"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1480" cy="80" r="260" fill="#ddd6fe" opacity=".6"/>
  <circle cx="90" cy="930" r="230" fill="#fed7aa" opacity=".45"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="120" fill="#6d28d9" font-size="22" letter-spacing="5">TALENTFLOW / MOODBOARD 03</text>
    <text x="90" y="240" fill="#171329" font-size="76" font-weight="700">Contratar bem é<br/><tspan fill="#6d28d9">cuidar do tempo.</tspan></text>
    <text x="94" y="355" fill="#57536b" font-size="24">Tecnologia para deixar o recrutador mais humano.</text>
    <rect x="90" y="470" width="610" height="245" rx="26" fill="#fff" stroke="#e6e0f7" filter="url(#shadow)"/>
    <text x="135" y="535" fill="#6d28d9" font-size="16" letter-spacing="2">DECISÃO COM CONTEXTO</text>
    <text x="135" y="590" fill="#171329" font-size="33" font-weight="600">Tudo que importa, em um só lugar.</text>
    <text x="135" y="640" fill="#706b82" font-size="19">Compare experiência, aderência e qualidade</text><text x="135" y="670" fill="#706b82" font-size="19">sem perder a história de cada candidato.</text>
    <rect x="970" y="120" width="470" height="650" rx="34" fill="#d7c8b4"/>
    <g clip-path="url(#photo)">
      <rect x="970" y="120" width="470" height="650" fill="#c4b5fd"/>
      <circle cx="1250" cy="350" r="180" fill="#f4c7a1"/>
      <path d="M990 780 C1000 520 1110 470 1240 480 C1370 490 1450 600 1480 780Z" fill="#3b2f68"/>
      <circle cx="1180" cy="315" r="48" fill="#f7d0af"/>
      <path d="M1125 300 C1140 210 1240 200 1270 285 C1210 270 1170 280 1125 300Z" fill="#241c46"/>
      <path d="M1000 180 C1150 90 1430 170 1470 320" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="42"/>
      <circle cx="1350" cy="620" r="80" fill="#fff" fill-opacity=".18"/>
    </g>
    <rect x="1190" y="680" width="300" height="140" rx="22" fill="#fff" fill-opacity=".9" stroke="#fff" filter="url(#shadow)"/>
    <text x="1225" y="730" fill="#706b82" font-size="14" letter-spacing="2">TALENTFLOW NOTE</text><text x="1225" y="775" fill="#171329" font-size="21" font-weight="600">A IA sugere.</text><text x="1225" y="802" fill="#6d28d9" font-size="21" font-weight="600">Você decide.</text>
    <text x="90" y="900" fill="#706b82" font-size="18">DIREÇÃO: editorial · confiança · calor humano · clareza</text>
  </g>
</svg>
