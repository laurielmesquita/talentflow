<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TalentFlow - Moodboards de Redesign</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #080812; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px; background: radial-gradient(circle at 50% 0%, #211747, #080812 55%); }
      main { max-width: 1500px; margin: 0 auto; }
      header { margin-bottom: 32px; }
      h1 { margin: 0 0 12px; font-size: clamp(32px, 5vw, 64px); letter-spacing: -.05em; }
      p { max-width: 720px; color: #a1a1aa; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #ffffff1c; border-radius: 20px; background: #ffffff08; box-shadow: 0 24px 80px #0008; }
      img { display: block; width: 100%; height: auto; }
      figcaption { padding: 16px 18px 20px; color: #c4b5fd; font-size: 14px; letter-spacing: .04em; }
      @media (max-width: 900px) { body { padding: 24px; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>TalentFlow / Visual Directions</h1>
        <p>Primeiro moodboard comparável do redesign. As três direções usam a mesma proporção e devem ser avaliadas por impacto, clareza, confiança e adequação ao produto.</p>
      </header>
      <section class="grid" aria-label="Direções visuais">
        <figure><img src="liquid-glass.svg" alt="Moodboard Liquid Glass" /><figcaption>01 / LIQUID GLASS</figcaption></figure>
        <figure><img src="cinematic-ai.svg" alt="Moodboard Cinematic AI" /><figcaption>02 / CINEMATIC AI</figcaption></figure>
        <figure><img src="human-editorial.svg" alt="Moodboard Human Editorial" /><figcaption>03 / HUMAN EDITORIAL</figcaption></figure>
      </section>
    </main>
  </body>
</html>
