<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TalentFlow Liquid Glass moodboard</title>
  <desc id="desc">Composição escura com auroras violetas, painéis translúcidos e elementos de análise de candidatos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090817"/><stop offset=".55" stop-color="#17113d"/><stop offset="1" stop-color="#090817"/></linearGradient>
    <radialGradient id="violet"><stop stop-color="#a78bfa" stop-opacity=".8"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#67e8f9" stop-opacity=".45"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="65"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="280" cy="230" r="360" fill="url(#violet)" filter="url(#blur)"/>
  <circle cx="1330" cy="770" r="360" fill="url(#cyan)" filter="url(#blur)"/>
  <path d="M0 820 C380 650 600 950 920 760s470-100 680-230" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="90" y="120" fill="#c4b5fd" font-size="22" letter-spacing="5">TALENTFLOW / MOODBOARD 01</text>
    <text x="90" y="210" fill="#fff" font-size="74" font-weight="700">Inteligência que<br/><tspan fill="#c4b5fd">flui com o talento.</tspan></text>
    <text x="94" y="330" fill="#cbd5e1" font-size="24">Premium, espacial e tecnológico.</text>
    <rect x="90" y="420" width="500" height="330" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".24" filter="url(#shadow)"/>
    <text x="125" y="475" fill="#e2e8f0" font-size="18" letter-spacing="2">SMART MATCH</text>
    <text x="125" y="535" fill="#fff" font-size="42" font-weight="700">Candidato ideal</text>
    <text x="125" y="575" fill="#cbd5e1" font-size="20">Engenharia de dados · São Paulo</text>
    <circle cx="490" cy="535" r="58" fill="none" stroke="#334155" stroke-width="12"/>
    <path d="M490 477 A58 58 0 1 1 444 570" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round"/>
    <text x="465" y="545" fill="#fff" font-size="25" font-weight="700">94</text>
    <rect x="125" y="645" width="390" height="10" rx="5" fill="#fff" fill-opacity=".12"/><rect x="125" y="645" width="310" height="10" rx="5" fill="url(#line)"/>
    <rect x="650" y="180" width="790" height="610" rx="34" fill="url(#glass)" stroke="#fff" stroke-opacity=".22" filter="url(#shadow)"/>
    <text x="705" y="245" fill="#e2e8f0" font-size="18" letter-spacing="2">RECRUITMENT INTELLIGENCE</text>
    <text x="705" y="310" fill="#fff" font-size="34" font-weight="600">Visão geral da operação</text>
    <g opacity=".9">
      <rect x="705" y="370" width="210" height="150" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <rect x="945" y="370" width="210" height="150" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <rect x="1185" y="370" width="210" height="150" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".12"/>
      <text x="730" y="420" fill="#94a3b8" font-size="16">CANDIDATOS</text><text x="730" y="480" fill="#fff" font-size="42" font-weight="700">1.284</text>
      <text x="970" y="420" fill="#94a3b8" font-size="16">MATCH MÉDIO</text><text x="970" y="480" fill="#67e8f9" font-size="42" font-weight="700">87%</text>
      <text x="1210" y="420" fill="#94a3b8" font-size="16">TEMPO POUPADO</text><text x="1210" y="480" fill="#c4b5fd" font-size="42" font-weight="700">42h</text>
    </g>
    <path d="M730 670 C820 580 890 710 980 615s145 15 230-70 125 30 175-30" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <line x1="730" y1="700" x2="1395" y2="700" stroke="#fff" stroke-opacity=".12"/>
    <text x="90" y="900" fill="#94a3b8" font-size="18">DIREÇÃO: glass translúcido · aurora · profundidade · dados em foco</text>
  </g>
</svg>
