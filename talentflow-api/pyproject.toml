[project]
name = "talentflow-api"
version = "2.4.0"
description = "Motor de Ingestão e Triagem Inteligente B2B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.30.6",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
    "pypdf>=4.3.1",
    "groq>=0.9.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "cloudinary>=1.40.0",
    "google-genai>=0.1.1",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "stripe>=10.11.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
